<!DOCTYPE html>
<html>
<head>
  <title>Can I Hug You? 🧸</title>
  <style>
    body {
      text-align: center;
      background-color: #ffe6f0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    h1 {
      margin-top: 80px;
      font-size: 30px;
    }

    .buttons {
      margin-top: 30px;
      position: relative;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin: 10px;
      transition: 0.3s;
    }

    #yesBtn {
      background-color: #ff66b2;
      color: white;
    }

    #noBtn {
      background-color: #cccccc;
      position: absolute;
    }

    #hugSection {
      display: none;
      margin-top: 30px;
      animation: fadeIn 1.5s ease-in-out;
    }

    #hugSection img {
      width: 300px;
      margin-top: 20px;
      border-radius: 20px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <h1>🧸 Can I Hug You? 💞</h1>

  <div class="buttons">
    <button id="yesBtn" onclick="showHug()">Yes 💖</button>
    <button id="noBtn" onmouseover="moveButton()">No 🙈</button>
  </div>

  <div id="hugSection">
    <h2>Sending you a virtual hug 🧸💞</h2>
    <p>I am always here for you, you can count on me 💛</p>
    <img src="hug.png" alt="Teddy Hug">
  </div>

  <script>
    function moveButton() {
      var button = document.getElementById("noBtn");
      var x = Math.random() * (window.innerWidth - 100);
      var y = Math.random() * (window.innerHeight - 50);
      button.style.left = x + "px";
      button.style.top = y + "px";
    }

    function showHug() {
      document.querySelector(".buttons").style.display = "none";
      document.getElementById("hugSection").style.display = "block";
    }
  </script>

</body>
</html>
