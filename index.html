<!DOCTYPE html>
<html>
<head>
  <title>Can I Hug You? 🧸</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      text-align: center;
      font-family: "Comic Sans MS", cursive;
      background: linear-gradient(to right, #ffd6e8, #ffeef7);
      overflow: hidden;
    }

    h1 {
      margin-top: 100px;
      font-size: 32px;
      color: #ff4d94;
    }

    .buttons {
      margin-top: 40px;
      position: relative;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      margin: 10px;
      transition: 0.3s ease;
    }

    #yesBtn {
      background-color: #ff66b2;
      color: white;
    }

    #yesBtn:hover {
      background-color: #ff3385;
    }

    #noBtn {
      background-color: #cccccc;
      position: absolute;
    }

    #hugSection {
      display: none;
      margin-top: 40px;
      animation: fadeIn 1.5s ease-in-out;
    }

    #hugSection img {
      width: 300px;
      margin-top: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>

<body>

  <h1>🧸 Can I Hug You? 💞</h1>

  <div class="buttons">
    <button id="yesBtn" onclick="showHug()">Yes 💖</button>
    <button id="noBtn" onmouseover="moveButton()">No 🙈</button>
  </div>

  <div id="hugSection">
    <h2>Sending you a warm virtual hug 🤗💖</h2>
    <p>I am always here for you. You can count on me 🧸✨</p>
    <img src="hug.png" alt="Teddy Hug">
  </div>

  <script>
    function moveButton() {
      var button = document.getElementById("noBtn");
      var x = Math.random() * (window.innerWidth - 100);
      var y = Math.random() * (window.innerHeight - 50);
      button.style.left = x + "px";
      button.style.top = y + "px";
    }

    function showHug() {
      document.querySelector(".buttons").style.display = "none";
      document.getElementById("hugSection").style.display = "block";
    }
  </script>

</body>
</html>
